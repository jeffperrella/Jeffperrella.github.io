<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom Lifts</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>

<body class="bg-gray-100 text-gray-900 select-none pb-12">

    <header class="bg-blue-600 text-white pt-12 pb-4 px-4 text-center sticky top-0 shadow-md z-10">
        <h1 id="nav-title" class="text-xl font-bold">Equipment Library</h1>
    </header>

    <main class="p-4 max-w-md mx-auto">
        
        <div id="home-view" class="space-y-4">
            
            <div id="last-workout-box" class="hidden bg-slate-800 text-slate-100 p-4 rounded-xl shadow-sm border border-slate-700">
                <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-2">⏮️ Last Workout Reference</h3>
                <pre id="last-workout-text" class="font-mono text-xs whitespace-pre-wrap leading-relaxed bg-slate-900/50 p-2 rounded-lg"></pre>
            </div>

            <div class="space-y-2">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-1">Select Your Training Location</h2>
                <button onclick="openCategory('Garage Gym')" class="w-full bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-gray-200 active:bg-gray-50">
                    <span class="font-bold text-lg">🏡 Garage Gym</span>
                    <span class="text-gray-400">→</span>
                </button>
                <button onclick="openCategory('The Devaney')" class="w-full bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-blue-200 bg-gradient-to-r from-blue-50/30 to-transparent active:bg-blue-50/50">
                    <span class="font-bold text-lg">☘️ The Devaney</span>
                    <span class="text-gray-400">→</span>
                </button>
                <button onclick="openCategory('Full Gym')" class="w-full bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-gray-200 active:bg-gray-50">
                    <span class="font-bold text-lg">🏋️‍♂️ Full Gym</span>
                    <span class="text-gray-400">→</span>
                </button>
                <button onclick="openCategory('Hotel Gym')" class="w-full bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-gray-200 active:bg-gray-50">
                    <span class="font-bold text-lg">🏢 Hotel Gym</span>
                    <span class="text-gray-400">→</span>
                </button>
                <button onclick="openCategory('Bodyweight')" class="w-full bg-white p-4 rounded-xl shadow-sm flex items-center justify-between border border-gray-200 active:bg-gray-50">
                    <span class="font-bold text-lg">🏃‍♂️ Bodyweight</span>
                    <span class="text-gray-400">→</span>
                </button>
            </div>
        </div>

        <div id="category-view" class="hidden space-y-4">
            <button onclick="showHome()" class="text-blue-600 font-medium text-sm mb-2 inline-block">← Back to Locations</button>
